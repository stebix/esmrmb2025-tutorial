[project]
name = "esmrmb-notebook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipywidgets>=8.1.7",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "scipy>=1.16.2",
    "tqdm>=4.67.1",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "jupyter>=1.1.1",
    "ipympl>=0.9.7",
    "plotly>=6.3.0",
    "attrs>=25.3.0",
    "rich>=14.1.0",
    "mplcursors>=0.7",
    "pandas>=2.3.2",
    "anywidget>=0.9.18",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
